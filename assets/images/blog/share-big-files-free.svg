<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="shareBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7ffd6"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="limeGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#b6e000" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#dbff4b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#shareBg)"/>
  <rect width="1200" height="630" fill="url(#limeGlow)"/>

  <!-- Transfer line between devices -->
  <line x1="330" y1="315" x2="870" y2="315" stroke="#a3c400" stroke-width="3" stroke-dasharray="14 12" stroke-linecap="round"/>
  <polygon points="858,305 878,315 858,325" fill="#a3c400"/>

  <!-- Sender device -->
  <g transform="translate(240, 315)">
    <rect x="-90" y="-70" width="180" height="140" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="-30" y="-36" width="60" height="72" rx="8" fill="#0f172a"/>
    <path d="M0 -14 L0 14 M-12 2 L0 14 L12 2" stroke="#dbff4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="rotate(180)"/>
    <text x="0" y="96" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="1.2">YOUR DEVICE</text>
  </g>

  <!-- Receiver device -->
  <g transform="translate(960, 315)">
    <rect x="-90" y="-70" width="180" height="140" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="-30" y="-36" width="60" height="72" rx="8" fill="#0f172a"/>
    <path d="M0 -14 L0 14 M-12 2 L0 14 L12 2" stroke="#dbff4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="0" y="96" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="1.2">RECEIVER</text>
  </g>

  <!-- Center file card -->
  <g transform="translate(600, 315)">
    <rect x="-120" y="-60" width="240" height="120" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-8" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="30">BIG FILES</text>
    <rect x="-60" y="14" width="120" height="28" rx="14" fill="#dbff4b"/>
    <text x="0" y="33" text-anchor="middle" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="1">100% FREE</text>
  </g>

  <!-- Top badge -->
  <g transform="translate(600, 75)">
    <rect x="-130" y="-18" width="260" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="0" y="6" text-anchor="middle" fill="#3f6212" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">NO SIGN-UP · NO SIZE LIMIT</text>
  </g>
</svg>
